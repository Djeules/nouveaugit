# Déploiement Netlify — site statique, aucun build nécessaire.
#
# `publish = "site"` et non la racine : seul ce dossier part en ligne. Tout
# ce qui vit à côté — DECISIONS.md, CLAUDE.md, README.md, tools/ — reste
# versionné dans le dépôt sans être servi. Ce n'est pas une question de
# confidentialité : DECISIONS.md raconte par quel dispositif la page opère,
# et ce site ne produit son effet qu'une fois, sur quelqu'un qui ne l'a pas
# vu venir. Le mode d'emploi n'a rien à faire à côté du tour.
[build]
  publish = "site"
  command = ""

# En-têtes de sécurité. La politique de sécurité du contenu est volontairement
# stricte : le site ne charge aucune ressource tierce, et ne doit pas commencer.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self' 'sha256-3hLtOxOqM92hxMCkBfawQyMhmej+fTDKt14HjHVqzqI='; form-action 'self'; frame-ancestors 'self'; base-uri 'self'"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
